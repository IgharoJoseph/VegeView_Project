{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VegeView</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <script src="{% static 'js/login.js' %}" defer></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            {% include 'partials/header.html' %}
        </div>
    </header>

    <div class="container">
        <div class="login-form">
            <h2>Login to Your Account</h2>

            {% if messages %}
            <div style="margin-bottom: 1rem;">
                {% for message in messages %}
                <div style="padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 8px; {% if message.tags == 'error' %}background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;{% else %}background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0;{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form id="loginForm" method="POST" action="{% url 'Login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">

                <label for="email">Email Address or Username</label>
                <input type="text" id="email" name="email" value="{{ identifier|default:'' }}" placeholder="farmer@example.com" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="********" required>
                
                <button type="submit">Login</button>
                
                <a href="{% url 'Forgot_Password' %}" class="forgot-password">Forgot Password?</a>
            </form>
            <div class="footer-links">
                <a href="{% url 'Signup' %}" class="signup-link">Don't have an account? Sign Up</a>
                <a href="#" class="privacy-link">Privacy Policy</a>
                <span>|</span>
                <a href="#" class="terms-link">Terms of Service</a>
            </div>
        </div>
    </div>
</body>
</html>
