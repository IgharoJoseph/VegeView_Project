{% load static %}
<div class="header-left">
    <a href="{% url 'HomePage' %}" style="display: flex; align-items: center; text-decoration: none;">
        <img src="{% static 'img/Logo 1.jpg' %}" alt="Logo" class="logo">
        <span style="font-weight: 700; font-size: 1.2rem; color: #ffffff; letter-spacing: -0.3px;">VegeView</span>
    </a>
    <nav class="nav" id="mainNav">
        <a href="{% url 'HomePage' %}" class="nav-link">Home</a>
        {% if user.is_authenticated %}
        <a href="{% url 'SymptomChecker' %}" class="nav-link" style="color: #4ade80; font-weight: 600;">Symptom Checker</a>
        <a href="{% url 'DiseaseDirectory' %}" class="nav-link">Disease Directory</a>
        {% else %}
        <a href="{% url 'Login' %}?next={% url 'SymptomChecker' %}" class="nav-link">Symptom Checker</a>
        <a href="{% url 'Login' %}?next={% url 'DiseaseDirectory' %}" class="nav-link">Disease Directory</a>
        {% endif %}
        <a href="/#about" class="nav-link">About</a>
        <a href="/#services" class="nav-link">Services</a>
        <a href="/#contact" class="nav-link">Contact</a>
    </nav>
</div>
<button class="menu-button" id="menuToggle" aria-label="Toggle navigation">
    <div class="menu-icon"></div>
</button>
<div class="header-right">
    {% if user.is_authenticated %}
        <span style="margin-right: 12px; font-weight: 500; color: #e2e8f0; font-size: 0.95rem;">Hi, {{ user.first_name|default:user.username }}</span>
        <button class="btn-secondary" onclick="window.location.href='{% url 'Logout' %}'">Log Out</button>
    {% else %}
        <button class="btn-secondary" onclick="window.location.href='{% url 'Signup' %}'">Sign Up</button>
        <button class="btn-accent" onclick="window.location.href='{% url 'Login' %}'">Log In</button>
    {% endif %}
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('menuToggle');
    const nav = document.getElementById('mainNav');
    if (btn && nav) {
        btn.addEventListener('click', function() {
            btn.classList.toggle('active');
            nav.classList.toggle('active');
        });
    }
});
</script>
